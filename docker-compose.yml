services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: discourse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discourse
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - discourse_internal

  redis:
    image: redis:7
    container_name: discourse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - discourse_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: discourse-web
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      NODE_ENV: production

      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DEVELOPER_EMAILS: admin@example.com
      DISCOURSE_ADMIN_PASSWORD: Admin@1234567890

      DISCOURSE_DB_HOST: postgres
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: discourse

      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: 6379
      DISCOURSE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379

      DISCOURSE_SMTP_ADDRESS: ""
      DISCOURSE_SMTP_PORT: 587
      DISCOURSE_SMTP_USER_NAME: ""
      DISCOURSE_SMTP_PASSWORD: ""

      # 单容器测试环境可以先关掉邮件
      DISCOURSE_DISABLE_EMAILS: "yes"
    ports:
      - "3000:3000"
    volumes:
      - discourse_uploads:/var/www/discourse/public/uploads
    networks:
      - discourse_internal

volumes:
  postgres_data:
  redis_data:
  discourse_uploads:

networks:
  discourse_internal:
    driver: bridge