services:
  postgres:
    image: harbor.rs.com/repo/pgvector:pg15
    container_name: discourse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discourse
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - discourse_internal

  redis:
    image: harbor.rs.com/repo/redis:7
    container_name: discourse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - discourse_internal

  web:
    image: harbor.rs.com/discourse/discourse-web:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: discourse-web
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      NODE_ENV: production

      DISCOURSE_HOSTNAME: ${DISCOURSE_HOSTNAME}
      DISCOURSE_DEVELOPER_EMAILS: ${DISCOURSE_DEVELOPER_EMAILS}
      DISCOURSE_ADMIN_PASSWORD: ${DISCOURSE_ADMIN_PASSWORD}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}

      DISCOURSE_DB_HOST: postgres
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: discourse

      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: 6379
      DISCOURSE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379

      # 单容器测试环境可以先关掉邮件
      DISCOURSE_DISABLE_EMAILS: "yes"
      DISCOURSE_SMTP_ADDRESS: ""
      DISCOURSE_SMTP_PORT: 587
      DISCOURSE_SMTP_USER_NAME: ""
      DISCOURSE_SMTP_PASSWORD: ""

    ports:
      - "${DISCOURSE_EXTERNAL_PORT}:80"
    volumes:
      - ./data/uploads:/var/www/discourse/public/uploads
    networks:
      - discourse_internal

networks:
  discourse_internal:
    driver: bridge


